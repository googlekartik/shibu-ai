services:
  - type: web
    name: shibu-ai
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 1 --threads 4 --timeout 120 --bind 0.0.0.0:$PORT app:app
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: HOST
        value: 0.0.0.0
      - key: CLOUD_ONLY
        value: "true"
      - key: HF_USE_LOCAL
        value: "0"
      - key: RAG_BACKEND
        value: auto
      # Set these in the Render dashboard (never in git):
      # OPENAI_API_KEY, HF_TOKEN, SECRET_KEY

  # Developer panel: same code, separate URL. Chat is disabled on
  # this service (DEV_PANEL=1); it serves /dev only. Requires the
  # blueprint sync to be approved in the Render dashboard.
  - type: web
    name: shibu-ai-dev
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 1 --threads 4 --timeout 120 --bind 0.0.0.0:$PORT app:app
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: HOST
        value: 0.0.0.0
      - key: CLOUD_ONLY
        value: "true"
      - key: HF_USE_LOCAL
        value: "0"
      - key: RAG_BACKEND
        value: auto
      - key: DEV_PANEL
        value: "1"
      # Set these in the Render dashboard for the DEV service only
      # (never in git, never in chat): GOOGLE_CLIENT_ID,
      # GOOGLE_CLIENT_SECRET, GOOGLE_REDIRECT_URI=<dev URL>/auth/callback,
      # SECRET_KEY, DATABASE_URL, DEV_OWNER_EMAIL
