services:
  - type: web
    name: shibu-ai
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 1 --threads 4 --timeout 120 --bind 0.0.0.0:$PORT app:app
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: HOST
        value: 0.0.0.0
      - key: CLOUD_ONLY
        value: "true"
      - key: RAG_BACKEND
        value: auto
      # Set these in the Render dashboard (never in git, never values):
      # GEMINI_API_KEY, GEMINI_MODEL, SECRET_KEY, BROWSER_SEARCH_ENABLED,
      # CHROME_EXECUTABLE_PATH, SEARCH_TIMEOUT_SECONDS, MAX_SEARCH_RESULTS,
      # LANGSEARCH_API_KEY, LANGSEARCH_API_BASE,
      # GEMINI_TIMEOUT_SECONDS, GEMINI_CONFIDENCE_THRESHOLD,
      # GEMINI_EMBEDDING_MODEL, SEMANTIC_CONFIDENCE_THRESHOLD

  # Developer panel: same code, separate URL. Chat is disabled on
  # this service (DEV_PANEL=1); it serves /dev only. Requires the
  # blueprint sync to be approved in the Render dashboard.
  - type: web
    name: shibu-ai-dev
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 1 --threads 4 --timeout 120 --bind 0.0.0.0:$PORT app:app
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: HOST
        value: 0.0.0.0
      - key: CLOUD_ONLY
        value: "true"
      - key: RAG_BACKEND
        value: auto
      - key: DEV_PANEL
        value: "1"
      # Set these in the Render dashboard for the DEV service only
      # (never in git, never in chat): GOOGLE_CLIENT_ID,
      # GOOGLE_CLIENT_SECRET, GOOGLE_REDIRECT_URI=<dev URL>/auth/callback,
      # SECRET_KEY, DATABASE_URL, DEV_OWNER_EMAIL
